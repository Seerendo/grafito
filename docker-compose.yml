# Grafito and its services. On your machine: docker compose up -d --build
# The app reaches the other services by service name (postgres, elasticsearch,
# redis, minio, collabora), not 127.0.0.1. The browser opens http://127.0.0.1:8080.
#
# Secrets and addresses are read from a .env file next to this one (see
# .env.example and the README's Installation section). The defaults are only
# meant for local testing. Internal service ports are bound to 127.0.0.1 only.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: grafito
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grafito}
      POSTGRES_DB: grafito
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - grafito_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafito -d grafito"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - grafito_es:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - grafito_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: grafito
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-grafito-secret}
      MC_HOST_local: http://grafito:${S3_SECRET_KEY:-grafito-secret}@127.0.0.1:9000
      # Lets Grafito read the bucket's capacity for Administration → Storage.
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - grafito_s3:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    environment:
      S3_SECRET_KEY: ${S3_SECRET_KEY:-grafito-secret}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 grafito $${S3_SECRET_KEY}; do sleep 2; done;
      mc mb -p local/grafito || true;
      "

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GRAFITO_FROM_DOCKER: "1"
      DATABASE_URL: postgres://grafito:${POSTGRES_PASSWORD:-grafito}@postgres:5432/grafito
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: grafito
      S3_ACCESS_KEY: grafito
      S3_SECRET_KEY: ${S3_SECRET_KEY:-grafito-secret}
      S3_REGION: us-east-1
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-grafito-dev-secret-cambia-esto}
      # Encrypts each user's AI keys. Change it (32+ characters) and don't lose it:
      # without it, saved keys can't be read. To rotate it, put the previous one in
      # GRAFITO_ENCRYPTION_KEY_PREVIOUS (see docs/OPERATIONS.md).
      GRAFITO_ENCRYPTION_KEY: ${GRAFITO_ENCRYPTION_KEY:-grafito-dev-encryption-key-cambia-esto-0001}
      GRAFITO_ENCRYPTION_KEY_PREVIOUS: ${GRAFITO_ENCRYPTION_KEY_PREVIOUS:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://127.0.0.1:8080}
      # Upload limit per file, in MB (100 by default with MinIO).
      GRAFITO_MAX_UPLOAD_MB: ${GRAFITO_MAX_UPLOAD_MB:-100}
      # Office editor (on by default). An empty COLLABORA_URL= turns it off.
      # See docs/OFFICE.md.
      COLLABORA_URL: ${COLLABORA_URL-http://127.0.0.1:9980}
      COLLABORA_INTERNAL_URL: ${COLLABORA_INTERNAL_URL:-http://collabora:9980}
      GRAFITO_WOPI_URL: ${GRAFITO_WOPI_URL:-http://app:8080}
      # Ollama and LM Studio run outside this compose (installed on the machine or
      # in a compose of their own). A "localhost" address in Account → AI (e.g.
      # http://localhost:11434 or http://localhost:1234/v1) is called on this
      # host machine through host.docker.internal. Any other reachable address
      # (LAN IP, hostname) works as is. An empty value turns the alias off.
      GRAFITO_LOCALHOST_ALIAS: ${GRAFITO_LOCALHOST_ALIAS-host.docker.internal}
      # Time zone for dates in emails (e.g. America/Lima). See docs/MAIL.md.
      TZ: ${TZ:-UTC}
    # Makes host.docker.internal resolve on Linux too (Docker Desktop already has it).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Daily database dump (pg_dump custom format) in ./backups, with retention.
  # Notes, file metadata and versions live in Postgres; file bytes are copied
  # by backup-files. Elasticsearch is rebuilt and Redis holds nothing essential.
  # How to restore: docs/OPERATIONS.md.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: grafito
      PGDATABASE: grafito
      PGPASSWORD: ${POSTGRES_PASSWORD:-grafito}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          file=/backups/grafito-$$(date -u +%Y%m%d-%H%M%S).dump
          if pg_dump -Fc -f "$$file.tmp"; then
            mv "$$file.tmp" "$$file"
            echo "backup: $$file"
          else
            rm -f "$$file.tmp"
            echo "backup: FAILED" >&2
          fi
          find /backups -name 'grafito-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done
    depends_on:
      postgres:
        condition: service_healthy

  # Copy of the uploaded files (the MinIO bucket) in ./backups/files, on the same
  # schedule. The mirror only adds: files deleted in Grafito are kept here, so an
  # older database dump still finds its files.
  backup-files:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    environment:
      S3_SECRET_KEY: ${S3_SECRET_KEY:-grafito-secret}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups/files:/backups/files
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 grafito "$$S3_SECRET_KEY" >/dev/null; do sleep 5; done
        while true; do
          if mc mirror --overwrite --quiet local/grafito /backups/files; then
            echo "files backup: $$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          else
            echo "files backup: FAILED" >&2
          fi
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done
    depends_on:
      minio-init:
        condition: service_completed_successfully

  # --- Office editor (on by default) ---
  # To turn it off: COLLABORA_URL= in .env and docker compose up -d --scale collabora=0
  # Collabora Online (CODE edition) is a separate service with its own license
  # (MPL 2.0) and terms of use: Grafito doesn't include it, it only talks to it
  # over WOPI. It works without internet once the image is downloaded.
  # See docs/OFFICE.md.
  collabora:
    image: collabora/code:26.04.4.2.1
    restart: unless-stopped
    environment:
      # Grafito as Collabora sees it (WOPISrc).
      aliasgroup1: ${GRAFITO_WOPI_URL:-http://app:8080}
      # frame_ancestors (below) is who may embed the editor: one value, no spaces.
      # 127.0.0.1 is always allowed; by default localhost too. On a server, set
      # GRAFITO_PUBLIC_ORIGIN to the address people open Grafito with.
      extra_params: >-
        --o:ssl.enable=false --o:ssl.termination=false
        --o:net.frame_ancestors=${GRAFITO_PUBLIC_ORIGIN:-localhost:*}
        --o:home_mode.enable=true --o:mount_jail_tree=false
      username: admin
      password: ${COLLABORA_ADMIN_PASSWORD:-grafito-office-cambia-esto}
      dictionaries: es_ES en_US
      DONT_GEN_SSL_CERT: "1"
    ports:
      - "9980:9980"

  # --- Only for testing external sign-in (not started by default) ---
  # docker compose --profile auth-test up -d
  # Test data in dev/auth-test/. Settings for Administration → Authentication:
  #   LDAP: ldap://openldap:389 · cn=admin,dc=grafito,dc=test / grafito-ldap
  #         base ou=people,dc=grafito,dc=test · filter (uid={{username}})
  #   SSO:  issuer http://keycloak:8080/realms/grafito · client grafito / grafito-sso-secret
  openldap:
    image: osixia/openldap:1.5.0
    profiles: ["auth-test"]
    command: --copy-service
    environment:
      LDAP_ORGANISATION: Grafito
      LDAP_DOMAIN: grafito.test
      LDAP_ADMIN_PASSWORD: grafito-ldap
    ports:
      - "3389:389"
    volumes:
      - ./dev/auth-test/ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["auth-test"]
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: grafito-keycloak
      # The browser uses 127.0.0.1:8180; the app talks to keycloak:8080.
      KC_HOSTNAME: http://127.0.0.1:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./dev/auth-test/keycloak:/opt/keycloak/data/import:ro

  # --- Only for testing email (not started by default) ---
  # docker compose --profile mail-test up -d
  # A fake mail server that keeps every message. In Administration → Email:
  # server "mailpit", port 1025, security "None". Inbox: http://127.0.0.1:8025
  mailpit:
    image: axllent/mailpit:v1.20.4
    profiles: ["mail-test"]
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  grafito_pg:
  grafito_es:
  grafito_s3:
  grafito_redis:
