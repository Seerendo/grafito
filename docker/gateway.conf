# Grafito's front door (the `gateway` service in docker-compose.yml).
#
# One port, 8080, carries the app and the Office editor (Collabora), so the
# editor is always on the same address as Grafito: opened directly
# (http://192.168.1.20:8080) or behind any HTTPS reverse proxy (nginx, Caddy,
# Traefik...). The browser then never mixes http and https, and Collabora
# needs no list of allowed addresses. See docs/OFFICE.md, "Servers and HTTPS".

# Docker's DNS, asked again every 10 s: the gateway starts without waiting for
# the app or Collabora, and follows them when they are recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" "";
}

# The address the browser is on. The form that opens the editor is a POST from
# Grafito's page, so its Origin header says it exactly, whatever proxies sit in
# front. Without it, the X-Forwarded-* headers of the proxy, or this request.
map $http_x_forwarded_proto $grafito_scheme {
  default $scheme;
  "~^\s*(?<fwd_proto>https?)" $fwd_proto;
}
map $http_x_forwarded_host $grafito_host {
  default $http_host;
  "~^\s*(?<fwd_host>[^,\s]+)" $fwd_host;
}
map $http_origin $grafito_origin {
  "~^https?://[^/\s]+$" $http_origin;
  default $grafito_scheme://$grafito_host;
}
# The editor's WebSocket address: wss:// for an https page, ws:// for http.
map $grafito_origin $grafito_ws {
  "~^http(?<ws_rest>.*)$" ws$ws_rest;
  default "";
}

# Collabora's own Content-Security-Policy, adjusted for this address: it may be
# embedded by Grafito ('self'), and its WebSocket goes to this address.
map $upstream_http_content_security_policy $office_csp_frames {
  "~^(?<csp_a>.*)frame-ancestors[^;]*(?<csp_b>.*)$" "${csp_a}frame-ancestors 'self'${csp_b}";
  default $upstream_http_content_security_policy;
}
map $office_csp_frames $office_csp {
  "~^(?<csp_c>.*)wss?://office\.internal(?<csp_d>.*)$" "${csp_c}${grafito_ws}${csp_d}";
  default $office_csp_frames;
}

# Reused connections to the app and Collabora (`keepalive`). Without them every
# request opened a new one, and sustained load ran out of local ports (502s
# after ~60,000 requests). `resolve` (nginx 1.27.3+) keeps following the
# container's address when it is recreated. `max_fails=0`: with a single
# server, a failed request while it restarts must not mark it down for 10 s.
upstream grafito_app {
  zone grafito_app 64k;
  server app:8080 resolve max_fails=0;
  keepalive 64;
}
upstream grafito_office {
  zone grafito_office 64k;
  server collabora:9980 resolve max_fails=0;
  keepalive 16;
}

server {
  listen 8080;
  server_tokens off;
  # Text compressed on the way out: the client bundle and server-function JSON
  # (a large workspace's tree) shrink several times. Streams (the assistant's
  # answers, framed responses) are not listed, so they are never held back.
  gzip on;
  gzip_proxied any;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/javascript text/css text/plain image/svg+xml application/manifest+json;
  # Grafito checks the upload limit itself (GRAFITO_MAX_UPLOAD_MB).
  client_max_body_size 0;

  # Collabora's admin console isn't part of Grafito.
  location ^~ /browser/dist/admin/ {
    return 404;
  }
  location ^~ /cool/adminws {
    return 404;
  }

  # The Office editor: its page, files and WebSocket.
  location ~ ^/(browser|hosting|cool)/ {
    proxy_pass http://grafito_office;
    proxy_http_version 1.1;
    # A fixed name, so the addresses Collabora writes in its page can be
    # swapped below for the one the browser is on.
    proxy_set_header Host office.internal;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy $office_csp always;
    sub_filter_once on;
    sub_filter 'data-host = "ws://office.internal"' 'data-host = "$grafito_ws"';
    sub_filter 'data-host = "wss://office.internal"' 'data-host = "$grafito_ws"';
  }

  # Everything else is Grafito.
  location / {
    proxy_pass http://grafito_app;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The AI assistant streams its answers.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
  }
}
