name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to commits (the tag is in the comment); bump them on purpose.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.13.1
          cache: npm
      - run: npm ci
      # The same Grafeno SDK the Docker image installs: its latest release.
      - run: npm install --no-save --no-audit --no-fund @grafenodb/client@latest
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: grafito:ci
          cache-from: type=gha
          # Pull requests read the cache but never write it, so main never builds on their layers.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
